# The areas of Ephyra: an index of where to work on what (#928).
#
# One entry per area. The `start-work` skill (.claude/skills/start-work) and the development site
# (devsite/) read this file. It is an index: small enough to read whole. What an area's guide says
# (ports, pitfalls, test data, decisions, the checklist before a PR) lives in the guide only.
#
# An area has a guide when docs/areas/<id>.md exists; there is no field for it.
#
# Fields (no others; .claude/skills/start-work/scripts/check-docs.py checks them):
#   id        the area's name, also the guide's file name (docs/areas/<id>.md)
#   title     shown on the site
#   summary   one sentence: what the area is
#   keywords  the words someone uses for it, in English: features, symptoms, class names
#   paths     3 to 8 files or folders to open first, most important first. Real paths from the
#             repository root, never a bare module (`core/`) unless the module is the area
#   docs      the docs to read, most important first (optional; the guide is not listed)
#   rules     the Konsist rules that guard it, numbers only (docs/architecture/rules.md; optional)
#   tests     one or two Gradle commands that test it fast (optional)
#
# Paths were checked against `main` when written; the code is right where they differ. Run
# `python3 .claude/skills/start-work/scripts/check-docs.py` after editing this file.

