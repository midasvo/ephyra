name: Release

# Jobs: `build` assembles each published app in parallel and uploads its signed APKs and R8
# mapping, and `publish` attaches them to the release once every build succeeded.

on:
  push:
    tags:
      # Releases only: vX.Y.Z. Betas (vX.Y.Z-beta.N) don't match, filter patterns match the whole tag.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One failed app fails the run and nothing is published, but let the others finish so a
      # rerun of the failed job is enough.
      fail-fast: false
      matrix:
        # Phone in both flavors (proprietary adds Google Cast, #626, #641), TV in libre only.
        include:
          - name: phone (libre)
            id: phone-libre
            task: ":app:phone:assembleLibreRelease"
            apks: app/phone/build/outputs/apk/libre/release
            mapping: app/phone/build/outputs/mapping/libreRelease/mapping.txt
            mapping_suffix: mapping
          - name: phone (proprietary)
            id: phone-proprietary
            task: ":app:phone:assembleProprietaryRelease"
            apks: app/phone/build/outputs/apk/proprietary/release
            mapping: app/phone/build/outputs/mapping/proprietaryRelease/mapping.txt
            mapping_suffix: proprietary-mapping
          - name: TV (libre)
            id: tv-libre
            task: ":app:tv:assembleLibreRelease"
            apks: app/tv/build/outputs/apk/libre/release
            mapping: app/tv/build/outputs/mapping/libreRelease/mapping.txt
            mapping_suffix: tv-mapping

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/findroid-ce.jks"

      - name: Assemble release APKs
        run: ./gradlew ${{ matrix.task }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/findroid-ce.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs and R8 mapping
        env:
          APKS: ${{ matrix.apks }}
          MAPPING: ${{ matrix.mapping }}
          MAPPING_SUFFIX: ${{ matrix.mapping_suffix }}
        run: |
          mkdir -p dist/apk dist/mapping
          cp "$APKS"/*.apk dist/apk/
          cp "$MAPPING" "dist/mapping/ephyra-${GITHUB_REF_NAME}-${MAPPING_SUFFIX}.txt"
          ls -l dist/apk dist/mapping

      - name: Upload APKs and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs and R8 mappings
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The release is created first with the changelog section as its notes (release
          # skill), so add to those notes instead of replacing them. No generated notes here: on
          # its own GitHub compares with Findroid's v1.0.2 (inherited with the fork) and lists
          # every PR since the fork. The release skill adds them with the previous release as
          # the start tag (gh release create --generate-notes --notes-start-tag).
          append_body: true
          body: |

            **Which APK?** `ephyra-v<version>-libre-<abi>.apk` is for phones and tablets and has no
            Google code. `ephyra-v<version>-proprietary-<abi>.apk` is the same app with Google Cast
            (Chromecast), which needs Google Play services to cast. The two install over each other
            and keep the login. `ephyra-v<version>-libre-tv-<abi>.apk` is for Android TV. Most phones
            need `arm64-v8a`; 32-bit TV boxes such as the Xiaomi Mi Box need `armeabi-v7a`. In
            Obtainium, filter the phone APK with `-libre-arm64-v8a\.apk$` or
            `-proprietary-arm64-v8a\.apk$`, the TV APK with `.*-tv-armeabi-v7a\.apk`.
          files: |
            dist/apk/*.apk
            dist/mapping/*.txt
          fail_on_unmatched_files: true
