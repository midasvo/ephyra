name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# actions: write is for the "Cancel superseded runs" step, which stops the runs of older commits
# of the same PR. It compares commits, which a concurrency group does not do.
permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cancel superseded runs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash .github/scripts/cancel-superseded-runs.sh

      - name: Verify CE translations
        run: |
          git remote add upstream https://github.com/jarnedemeulemeester/findroid.git 2>/dev/null || true
          git fetch upstream main --depth=1
          python3 .claude/skills/translate-strings/scripts/check-translations.py
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/*/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
