name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer push to the same PR cancels the older run; on main the group is the sha, so nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify CE translations
        run: |
          git remote add upstream https://github.com/jarnedemeulemeester/findroid.git 2>/dev/null || true
          git fetch upstream main --depth=1
          python3 .claude/skills/translate-strings/scripts/check-translations.py
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/*/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
