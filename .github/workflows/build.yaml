name: Build

# Changes that touch only paths no Gradle build and no translation check reads (docs, the site,
# Markdown, store metadata, branding sources, the Claude skills other than translate-strings) don't
# run this workflow. The last matching pattern wins, so the translate-strings skill is put back
# after the Markdown and .claude/ exclusions: its script is the "Verify CE translations" job.
on:
  push:
    branches:
      - main
    paths: &build-paths
      - "**"
      - "!docs/**"
      - "!site/**"
      - "!**.md"
      - "!images/**"
      - "!fastlane/**"
      - "!.claude/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/FUNDING.yml"
      - "!LICENSE"
      - ".claude/skills/translate-strings/**"
  pull_request:
    branches:
      - main
    paths: *build-paths

# actions: write is for the "Cancel superseded runs" job, which stops the runs of older commits
# of the same PR. It compares commits, which a concurrency group does not do.
permissions:
  contents: read
  pull-requests: read
  actions: write

# The jobs run in parallel. Together the assemble jobs build what `./gradlew assembleDebug` builds:
# every debug app variant and the debug AARs of the library modules (in the phone libre job, which
# compiles all of those modules anyway).
jobs:
  cancel-superseded:
    name: Cancel superseded runs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Cancel superseded runs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash .github/scripts/cancel-superseded-runs.sh

  translations:
    name: Verify CE translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify CE translations
        run: |
          git remote add upstream https://github.com/jarnedemeulemeester/findroid.git 2>/dev/null || true
          git fetch upstream main --depth=1
          python3 .claude/skills/translate-strings/scripts/check-translations.py

  assemble:
    name: Assemble ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone (libre)
            artifact: debug-apks-phone-libre
            tasks: >-
              :app:phone:assembleLibreDebug
              :core:assembleDebug
              :data:assembleDebug
              :modes:film:assembleDebug
              :player:cast:assembleLibreDebug
              :player:core:assembleDebug
              :player:local:assembleDebug
              :settings:assembleDebug
              :setup:assembleDebug
            apks: app/phone/build/outputs/apk/libre/debug/*.apk
          - name: phone (proprietary)
            artifact: debug-apks-phone-proprietary
            tasks: :app:phone:assembleProprietaryDebug :player:cast:assembleProprietaryDebug
            apks: app/phone/build/outputs/apk/proprietary/debug/*.apk
          - name: TV
            artifact: debug-apks-tv
            # Every TV flavor (libre only today).
            tasks: :app:tv:assembleDebug
            apks: app/tv/build/outputs/apk/*/debug/*.apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.apks }}
          if-no-files-found: error
