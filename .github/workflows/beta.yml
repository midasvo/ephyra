name: Beta

# Publishes the `staging` build type of the phone and TV apps ("Ephyra Beta", app id
# nl.midasvo.findroid.ce.staging) as a GitHub prerelease, so it can be followed in Obtainium
# next to the stable app. Run it for an open pull request with:
#   gh workflow run beta.yml -f pr=<number>
# which builds the PR merged into its base (refs/pull/<number>/merge), so the PR branch does not
# need this workflow or the staging Gradle setup itself. To build a branch as-is instead:
#   gh workflow run beta.yml --ref <branch>
#
# Beta tags look like v<next patch>-beta.<run_number> (v2.0.1-beta.12 after the 2.0.0 release), so
# they sort after the last release. They must never match release.yml's `v[0-9]+.[0-9]+.[0-9]+`.
#
# Jobs: `prepare` resolves the source and the version, `build` assembles each app in parallel and
# uploads its APKs and R8 mapping, and `publish` creates the prerelease once every build succeeded.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to build merged into its base (leave empty to build the selected branch)"
        required: false
        type: string
  push:
    branches:
      - main
    # A push that touches only docs, the site, Markdown, store metadata, branding sources or the
    # Claude skills changes nothing in the APKs. The same list as build.yaml, which also runs for
    # the translate-strings skill because it runs its check.
    paths:
      - "**"
      - "!docs/**"
      - "!site/**"
      - "!**.md"
      - "!images/**"
      - "!fastlane/**"
      - "!.claude/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/FUNDING.yml"
      - "!LICENSE"

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

env:
  # Number of beta prereleases (and their tags) to keep; older ones are deleted.
  KEEP_BETAS: 3

jobs:
  prepare:
    name: Prepare beta
    # Merging a release PR is a push to main too, but that code is the stable release and the
    # previous beta already has all of it. The merge commit reads
    # "Merge pull request #N from midasvo/release/vX.Y.Z". The other jobs need this one, so they
    # are skipped with it.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      label: ${{ steps.source.outputs.label }}
      link: ${{ steps.source.outputs.link }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}

    steps:
      - name: Resolve source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          if [ -z "$PR" ]; then
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "link=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PR" in
            *[!0-9]*)
              echo "pr must be a pull request number, got '$PR'" >&2
              exit 1
              ;;
          esac

          # The release keystore is available to the build jobs, so never build code from forks.
          # They need this job, so this check runs before any job that sees the keystore secrets.
          # mergeable is null while GitHub is still computing the test merge; poll briefly.
          for _ in $(seq 1 10); do
            info=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
              --jq '[.state, (.head.repo.full_name == .base.repo.full_name), (.mergeable | tostring), (.merge_commit_sha // "none"), .head.ref] | @tsv')
            IFS=$'\t' read -r state same_repo mergeable merge_sha head_ref <<< "$info"
            [ "$mergeable" != "null" ] && break
            sleep 3
          done
          if [ "$state" != "open" ]; then
            echo "PR #$PR is $state, not open" >&2
            exit 1
          fi
          if [ "$same_repo" != "true" ]; then
            echo "PR #$PR comes from a fork; refusing to build it with the release keystore" >&2
            exit 1
          fi
          if [ "$mergeable" != "true" ]; then
            echo "PR #$PR has no test merge with its base (mergeable=$mergeable); resolve conflicts first" >&2
            exit 1
          fi
          echo "ref=${merge_sha}" >> "$GITHUB_OUTPUT"
          echo "label=PR #${PR} (${head_ref})" >> "$GITHUB_OUTPUT"
          echo "link=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR}" >> "$GITHUB_OUTPUT"

      - name: Checkout version file
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}
          sparse-checkout: buildSrc

      - name: Compute beta version
        id: version
        run: |
          # The same name Gradle gives the beta: EphyraVersion.NEXT_PATCH + "-beta.<run>".
          name=$(grep -oP 'const val NAME = "\K[0-9]+\.[0-9]+\.[0-9]+' buildSrc/src/main/kotlin/EphyraVersion.kt)
          if [ -z "$name" ]; then
            echo "Could not read NAME from EphyraVersion.kt" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          version="${major}.${minor}.$((patch + 1))-beta.${GITHUB_RUN_NUMBER}"
          if [[ "v${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Beta tag v${version} would trigger the stable release workflow" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One failed app fails the run and nothing is published, but let the others finish so a
      # rerun of the failed job is enough.
      fail-fast: false
      matrix:
        include:
          - name: phone (libre)
            id: phone-libre
            task: ":app:phone:assembleLibreStaging"
            apks: app/phone/build/outputs/apk/libre/staging
            mapping: app/phone/build/outputs/mapping/libreStaging/mapping.txt
            mapping_suffix: mapping
          - name: phone (proprietary)
            id: phone-proprietary
            task: ":app:phone:assembleProprietaryStaging"
            apks: app/phone/build/outputs/apk/proprietary/staging
            mapping: app/phone/build/outputs/mapping/proprietaryStaging/mapping.txt
            mapping_suffix: proprietary-mapping
          - name: TV (libre)
            id: tv-libre
            task: ":app:tv:assembleLibreStaging"
            apks: app/tv/build/outputs/apk/libre/staging
            mapping: app/tv/build/outputs/mapping/libreStaging/mapping.txt
            mapping_suffix: tv-mapping

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/findroid-ce.jks"

      - name: Assemble staging APKs
        run: ./gradlew ${{ matrix.task }}
        env:
          BETA_BUILD: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/findroid-ce.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs and R8 mapping
        env:
          APKS: ${{ matrix.apks }}
          MAPPING: ${{ matrix.mapping }}
          MAPPING_NAME: ephyra-${{ needs.prepare.outputs.tag }}-${{ matrix.mapping_suffix }}.txt
        run: |
          mkdir -p dist/apk dist/mapping
          cp "$APKS"/*.apk dist/apk/
          cp "$MAPPING" "dist/mapping/$MAPPING_NAME"
          ls -l dist/apk dist/mapping

      - name: Upload APKs and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: beta-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish beta
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Download APKs and R8 mappings
        uses: actions/download-artifact@v8
        with:
          pattern: beta-*
          path: dist

      # Artifacts are kept for a day. A failed build that is rerun after that would leave this
      # job with only the artifacts that still exist, so check that every app is there.
      - name: Check that every app is present
        run: |
          for id in phone-libre phone-proprietary tv-libre; do
            dir="dist/beta-$id"
            if ! ls "$dir"/apk/*.apk >/dev/null 2>&1 || ! ls "$dir"/mapping/*.txt >/dev/null 2>&1; then
              echo "::error::The APKs or the R8 mapping of $id are missing; rerun all jobs."
              exit 1
            fi
          done
          ls -l dist/*/apk dist/*/mapping

      # The changelog is relative to the latest stable release, so this needs the whole history and
      # the tags. A checkout is simpler than the compare API, which caps at 250 commits and does
      # not give first-parent merges.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          # The downloaded APKs are already in the workspace.
          clean: false

      # Pull request titles are untrusted text: the script reads them as data and writes them to
      # a file, they never reach a command through a workflow expression.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          LABEL: ${{ needs.prepare.outputs.label }}
          LINK: ${{ needs.prepare.outputs.link }}
        run: |
          changes="$RUNNER_TEMP/new-since.md"
          if ! bash .github/scripts/beta-changelog.sh "$SHA" "$TAG" "$changes" || [ ! -s "$changes" ]; then
            echo "The list of changes could not be generated." > "$changes"
          fi
          {
            cat "$changes"
            printf '\n---\n\n'
            printf 'Beta build of **%s** (%s) at commit %s.\n' "$LABEL" "$LINK" "$SHA"
            cat <<'NOTES'

          This is the "Ephyra Beta" app (`nl.midasvo.findroid.ce.staging`). It installs next to the
          stable Ephyra app and keeps its own data. Betas are untested; expect bugs.

          **Which APK?** A phone or tablet has two variants. `-libre-<abi>.apk` has no Google code.
          `-proprietary-<abi>.apk` is the same app with **Google Cast** (Chromecast): cast to a TV
          from the top bar; it needs Google Play services to cast. The two install over each other
          and keep the login. In Obtainium, filter the APK with `-beta\.\d+-libre-arm64-v8a\.apk$`
          or `-beta\.\d+-proprietary-arm64-v8a\.apk$`.

          For Android TV, take a `-libre-tv-<abi>.apk`: `armeabi-v7a` for 32-bit boxes such as the Xiaomi
          Mi Box, `arm64-v8a` for 64-bit ones. Phone and TV share one app ID, so the TV APK replaces
          the phone beta on a device and keeps its login.
          NOTES
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Beta ${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.label }} @ ${{ needs.prepare.outputs.short_sha }})
          prerelease: true
          make_latest: false
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/*/apk/*.apk
            dist/*/mapping/*.txt
          fail_on_unmatched_files: true

      - name: Delete old beta prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v.+-beta[.][0-9]+$")))]
                  | sort_by(.createdAt) | reverse | .[(env.KEEP_BETAS | tonumber):] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
